<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>JobFlow AI — Career Workspace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#2563eb;--primary2:#1d4ed8;--bg:#f5f7fb;--surface:#fff;--text:#172033;--muted:#667085;--border:#e5e7eb;--success:#16a34a;--danger:#dc2626;--warning:#d97706;--shadow:0 8px 30px rgba(15,23,42,.07);--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:.86rem}.danger{color:var(--danger)}.success{color:var(--success)}
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff;font-weight:700;transition:.2s}.btn:hover{background:var(--primary2);transform:translateY(-1px)}.btn.secondary{background:#eef4ff;color:var(--primary)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}.btn.danger{background:#fee2e2;color:#b91c1c}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eff6ff,#f8fafc)}.auth-card{width:min(100%,430px);background:var(--surface);padding:28px;border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--border)}.brand{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:800}.logo{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900}.auth-card h1{margin:22px 0 8px}.tabs{display:flex;background:#f1f5f9;padding:4px;border-radius:10px;margin:22px 0}.tabs button{flex:1;border:0;padding:10px;border-radius:8px;background:transparent;font-weight:700}.tabs button.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);color:var(--primary)}
.field{margin-bottom:14px}.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}.field textarea{min-height:110px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .full{grid-column:1/-1}
.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;z-index:20}.side-brand{padding:4px 10px 25px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:700}.nav button:hover,.nav button.active{background:#eff6ff;color:var(--primary)}.main{margin-left:250px;min-height:100vh}.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.page{padding:24px;max-width:1500px;margin:auto}.page-title{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.page-title h1{margin:0;font-size:1.7rem}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat .label{color:var(--muted);font-size:.9rem}.stat .value{font-size:1.8rem;font-weight:800;margin-top:5px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.job-card{display:flex;flex-direction:column;gap:10px}.job-card h3{margin:0}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#eef4ff;color:#2453b7;border-radius:999px;padding:4px 8px;font-size:.76rem;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{font-size:.82rem;color:var(--muted)}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.75rem;font-weight:800;background:#eef2f7}.badge.applied{background:#dbeafe;color:#1d4ed8}.badge.interview{background:#fef3c7;color:#92400e}.badge.offer{background:#dcfce7;color:#166534}.badge.rejected{background:#fee2e2;color:#991b1b}.empty{padding:35px;text-align:center;color:var(--muted)}.locked{position:relative;overflow:hidden}.locked .lock-overlay{position:absolute;inset:0;background:rgba(255,255,255,.92);display:grid;place-items:center;text-align:center;padding:20px;z-index:2}.resume{background:#fff;color:#111827;padding:34px;min-height:700px;border:1px solid #ddd}.resume h1{margin:0;font-size:2rem}.resume h2{font-size:1rem;border-bottom:1px solid #ddd;padding-bottom:5px;margin-top:22px}.resume-section{white-space:pre-wrap}.cover-output{white-space:pre-wrap;line-height:1.65}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--primary)}.toast-area{position:fixed;right:18px;top:18px;z-index:100;display:grid;gap:8px}.toast{padding:12px 15px;border-radius:10px;background:#111827;color:#fff;box-shadow:var(--shadow);max-width:340px}.mobile-nav{display:none}.loading{opacity:.65;pointer-events:none}.profile-avatar{width:54px;height:54px;border-radius:50%;background:#dbeafe;color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:1.2rem}
.dark{--bg:#0f172a;--surface:#111827;--text:#e5e7eb;--muted:#9ca3af;--border:#263244;--shadow:0 8px 30px rgba(0,0,0,.2)}.dark .topbar{background:rgba(17,24,39,.9)}.dark .nav button:hover,.dark .nav button.active,.dark .btn.secondary{background:#172554}.dark .resume{color:#111827}.dark .auth-wrap{background:#0f172a}.dark .tabs{background:#1f2937}.dark .tabs button.active{background:#111827}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{display:none}.main{margin-left:0;padding-bottom:70px}.topbar{padding:12px 15px}.page{padding:16px}.cards,.grid2,.grid3,.form-grid{grid-template-columns:1fr}.mobile-nav{position:fixed;display:flex;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:30;justify-content:space-around;padding:7px}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:.72rem;font-weight:700;padding:5px}.mobile-nav button.active{color:var(--primary)}.page-title{align-items:flex-start;flex-direction:column}.topbar .hide-mobile{display:none}}
</style>
</head>
<body>
<div id="toastArea" class="toast-area"></div>

<section id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><div class="logo">JF</div> JobFlow AI</div>
    <h1 id="authTitle">Welcome back</h1>
    <p id="authSubtitle" class="muted">Manage your job search in one place.</p>
    <div class="tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="signupTab" type="button">Create account</button>
    </div>
    <form id="authForm">
      <div id="nameField" class="field hidden"><label for="authName">Full name</label><input id="authName" autocomplete="name"></div>
      <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></div>
      <button id="authSubmit" class="btn" type="submit" style="width:100%">Login</button>
    </form>
    <p id="authMessage" class="small danger"></p>
    <p class="small muted">A 48-hour free trial starts when a new account is created.</p>
  </div>
</section>

<section id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand"><div class="brand"><div class="logo">JF</div> JobFlow AI</div></div>
    <nav id="sideNav" class="nav"></nav>
    <div style="position:absolute;bottom:18px;left:14px;right:14px">
      <button id="logoutBtn" class="btn ghost" style="width:100%">Log out</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><strong id="welcomeText">Career Workspace</strong><div id="statusText" class="small muted"></div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="themeBtn" class="btn ghost" type="button">☾</button>
        <button id="mobileMenuBtn" class="btn secondary hide-mobile" type="button">Menu</button>
      </div>
    </header>
    <div id="content" class="page"></div>
  </main>
  <nav id="mobileNav" class="mobile-nav"></nav>
</section>

<script>
(function(){
"use strict";

const CONFIG={
  supabaseUrl:"https://gpzkuewosylwotymqeub.supabase.co",
  supabaseKey:"sb_publishable_lV8_94FzT9_uQQaPoAOXNA_xEE2tzKS",
  ownerEmail:"mdnawaz6052@gmail.com",
  trialHours:48,
  premiumPrice:499
};
const LS={data:"jobflow_data_v3",resume:"jobflow_resume_v3",theme:"jobflow_theme_v3"};
let supabaseClient=null, session=null, currentUser=null, authMode="login", activePage="dashboard";
let state={jobs:[],savedJobs:[],applications:[],profile:{},subscription:null,resume:null};
let interviewIndex=0, interviewAnswers={}, interviewScore=0;

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const uid=()=>crypto&&crypto.randomUUID?crypto.randomUUID():"id_"+Date.now()+"_"+Math.random().toString(36).slice(2);
function toast(msg,type="info"){const el=document.createElement("div");el.className="toast";el.textContent=msg;if(type==="error")el.style.background="#b91c1c";if(type==="success")el.style.background="#166534";$("toastArea").appendChild(el);setTimeout(()=>el.remove(),3200);}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS.data)||"{}");state={...state,...d};state.jobs=Array.isArray(state.jobs)?state.jobs:[];state.savedJobs=Array.isArray(state.savedJobs)?state.savedJobs:[];state.applications=Array.isArray(state.applications)?state.applications:[];state.profile=state.profile||{};state.resume=state.resume||null;}catch(e){toast("Local data could not be loaded.","error");}}
function saveLocal(){try{localStorage.setItem(LS.data,JSON.stringify(state));}catch(e){toast("Local storage is unavailable.","error");}}
function isOwner(){return !!currentUser&&String(currentUser.email||"").toLowerCase()===CONFIG.ownerEmail.toLowerCase();}
function trialEnd(){const p=state.profile||{};return p.trialEndsAt?new Date(p.trialEndsAt):null;}
function isPremium(){return isOwner()||!!(state.subscription&&state.subscription.status==="active");}
function trialActive(){const d=trialEnd();return !!d&&d.getTime()>Date.now();}
function hasAccess(feature="basic"){return feature==="basic"||isPremium()||trialActive();}
function statusLabel(){if(isOwner())return"Owner • Unlimited";if(isPremium())return"Premium";if(trialActive())return"Free trial • "+Math.max(0,Math.ceil((trialEnd()-Date.now())/3600000))+"h left";return"Trial ended • Premium required";}
function navItems(){return[
["dashboard","⌂","Dashboard"],["jobs","⌕","Find Jobs"],["saved","★","Saved Jobs"],["applications","▣","Applications"],["pipeline","▥","Pipeline"],["analytics","◔","Analytics"],["resume","▤","Resume Builder"],["cover","✎","Cover Letter"],["interview","◎","Interview Prep"],["profile","●","Profile"],["settings","⚙","Settings"]
];}
function renderNav(){const items=navItems();$("sideNav").innerHTML=items.map(x=>`<button type="button" data-nav="${x[0]}" class="${activePage===x[0]?"active":""}">${x[1]}&nbsp; ${x[2]}</button>`).join("");$("mobileNav").innerHTML=items.slice(0,6).map(x=>`<button type="button" data-nav="${x[0]}" class="${activePage===x[0]?"active":""}">${x[1]}<br>${x[2]}</button>`).join("");}
function navigate(page){activePage=page;renderNav();renderPage();window.scrollTo({top:0,behavior:"smooth"});}
function renderPage(){const f={dashboard:renderDashboard,jobs:renderJobs,saved:renderSaved,applications:renderApplications,pipeline:renderPipeline,analytics:renderAnalytics,resume:renderResume,cover:renderCover,interview:renderInterview,profile:renderProfile,settings:renderSettings};$("content").innerHTML=(f[activePage]||renderDashboard)();bindPageEvents();}
function baseHeader(title,sub,action=""){return`<div class="page-title"><div><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function renderDashboard(){const apps=state.applications,saved=state.savedJobs;const interviews=apps.filter(a=>a.status==="Interview").length,offers=apps.filter(a=>a.status==="Offer").length;return baseHeader("Dashboard","Your job-search command center.",`<button class="btn" data-nav="jobs">Find jobs</button>`)+
`<div class="cards"><div class="card stat"><div class="label">Saved Jobs</div><div class="value">${saved.length}</div></div><div class="card stat"><div class="label">Applications</div><div class="value">${apps.length}</div></div><div class="card stat"><div class="label">Interviews</div><div class="value">${interviews}</div></div><div class="card stat"><div class="label">Offers</div><div class="value">${offers}</div></div></div>
<div class="grid2" style="margin-top:18px"><div class="card"><h3>Account status</h3><p>${esc(statusLabel())}</p>${!isPremium()&&!trialActive()?`<button class="btn" data-nav="settings">Unlock Premium • ₹${CONFIG.premiumPrice}</button>`:""}<p class="small muted">Basic job tracking remains available with local storage.</p></div><div class="card"><h3>Recent applications</h3>${apps.slice(-5).reverse().map(appRow).join("")||`<div class="empty">No applications yet.</div>`}</div></div>`;}
function appRow(a){return`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><strong>${esc(a.jobTitle)}</strong><div class="small muted">${esc(a.company)} • ${esc(a.location)} • ${esc(a.date||"")}</div><span class="badge ${String(a.status||"").toLowerCase()}">${esc(a.status)}</span></div>`}
function sampleJobs(){return[
{id:"j1",title:"Digital Marketing Executive",company:"Digital Mojo",location:"Hyderabad",description:"Plan campaigns, social media and performance marketing initiatives.",skills:["Digital Marketing","SEO","Social Media"]},
{id:"j2",title:"SEO Analyst",company:"Tech Mahindra",location:"Hyderabad",description:"Support search strategy, keyword research and website optimization.",skills:["SEO","Analytics","Content"]},
{id:"j3",title:"Software Developer Intern",company:"T-Hub Startup",location:"Hyderabad",description:"Build and test web applications with a collaborative engineering team.",skills:["JavaScript","HTML","CSS"]},
{id:"j4",title:"Business Development Intern",company:"Startup India",location:"Remote",description:"Research prospects, qualify leads and support business growth.",skills:["Sales","Research","Communication"]},
{id:"j5",title:"Content & Social Media Intern",company:"Creative Studio",location:"Remote",description:"Create social content, campaign ideas and performance reports.",skills:["Content","Social Media","Canva"]}
];}
const REAL_JOBS_API="https://api.jobopportunitiesapi.org/public/jobs";
let realJobsLoading=false;
let realJobsNotice="";

function normalizeRealJob(raw,index=0){
  const title=String(raw.title||raw.job_title||raw.name||"Untitled job").trim();
  const company=String(raw.company||raw.company_name||raw.employer||"Company").trim();
  const location=String(raw.location||raw.locations||raw.city||raw.state||"India").replace(/\s+/g," ").trim();
  const description=String(raw.description||raw.summary||raw.body||"Job opportunity from the employer source.").trim().slice(0,3500);
  const skills=Array.isArray(raw.skills)?raw.skills:(typeof raw.skills==="string"?raw.skills.split(/[,|]/).map(x=>x.trim()).filter(Boolean):[]);
  const applyUrl=raw.apply_url||raw.application_url||raw.url||raw.source_url||raw.job_url||"";
  const id=String(raw.id||raw.job_id||raw.uuid||`${company}-${title}-${index}`).replace(/[^a-zA-Z0-9_-]/g,"_").slice(0,180);
  return {id:`real_${id}`,title,company,location,description,skills:skills.slice(0,12),applyUrl,sourceUrl:raw.source_url||raw.provider_url||applyUrl,employmentType:raw.employment_type||raw.job_type||"",remote:raw.remote_confirmed===true||raw.remote===true?"Remote":"",postedAt:raw.published_at||raw.posted_at||raw.created_at||""};
}

async function fetchRealJobs(filters={}){
  const params=new URLSearchParams();
  params.set("country","IN");
  params.set("limit","50");
  if(filters.q)params.set("title",filters.q);
  if(filters.location)params.set("location",filters.location);
  if(filters.category&&filters.category!=="All")params.set("category",filters.category);
  if(filters.days)params.set("days",filters.days);
  const response=await fetch(`${REAL_JOBS_API}?${params.toString()}`,{headers:{Accept:"application/json"}});
  if(!response.ok)throw new Error(`Real jobs service returned ${response.status}`);
  const payload=await response.json();
  const rows=Array.isArray(payload)?payload:(Array.isArray(payload.data)?payload.data:(Array.isArray(payload.jobs)?payload.jobs:[]));
  return rows.map(normalizeRealJob);
}

function getJobs(){if(!state.jobs.length){state.jobs=sampleJobs();saveLocal();}return state.jobs;}
function renderJobs(){return baseHeader("Find Jobs","Search live employer-sourced opportunities across India. Applications open the available official source link.",`<button class="btn secondary" id="resetJobs" type="button">Reset</button>`)+
`<div class="card" style="margin-bottom:18px"><form id="jobSearchForm"><div class="form-grid"><div class="field"><label>Title, skill or company</label><input id="jobQuery" placeholder="e.g. civil engineer, mechanical, Java, electronics"></div><div class="field"><label>Location</label><input id="jobLocation" placeholder="e.g. Hyderabad, Bengaluru, Telangana, Remote"></div><div class="field"><label>Engineering / career area</label><select id="jobCategory"><option>All</option><option>Engineering</option><option>Software</option><option>Data</option><option>Electrical</option><option>Electronics</option><option>Mechanical</option><option>Civil</option><option>Chemical</option><option>Automotive</option><option>Aerospace</option><option>Biomedical</option><option>Environmental</option><option>Industrial</option><option>Manufacturing</option><option>Telecommunications</option><option>Instrumentation</option><option>Petroleum</option><option>Architecture</option><option>Business</option><option>Marketing</option><option>Finance</option><option>Operations</option><option>Design</option><option>Internship</option></select></div><div class="field"><label>Posted within</label><select id="jobDays"><option value="7">7 days</option><option value="14">14 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">1 year</option></select></div></div><button class="btn" type="submit">Search Live Jobs</button></form><div id="realJobsStatus" class="small muted" style="margin-top:10px">Live search uses employer-sourced job data. The service returns current matching results; it does not preload 100,000 records into the browser.</div></div><div id="jobResults" class="grid3">${jobCards(getJobs())}</div>`;}
function jobCards(jobs){if(!jobs.length)return`<div class="card empty" style="grid-column:1/-1">No jobs match your search.</div>`;return jobs.map(j=>{const saved=state.savedJobs.some(x=>x.id===j.id);const tracked=state.applications.some(a=>a.jobId===j.id);return`<article class="card job-card"><div class="small muted">${esc(j.company)}</div><h3>${esc(j.title)}</h3><div>📍 ${esc(j.location)}</div>${j.employmentType?`<div class="small muted">${esc(j.employmentType)} ${j.remote?"• "+esc(j.remote):""}</div>`:""}<p class="muted">${esc(j.description)}</p><div class="tags">${(j.skills||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div><div class="actions"><button class="btn ${saved?"secondary":""}" data-save="${esc(j.id)}" type="button">${saved?"★ Saved":"☆ Save"}</button>${j.applyUrl?`<a class="btn" href="${esc(j.applyUrl)}" target="_blank" rel="noopener noreferrer">Apply on company site</a>`:""}<button class="btn ghost" data-track="${esc(j.id)}" type="button">${tracked?"View application":"Track Application"}</button></div></article>`}).join("");}
function renderSaved(){const jobs=getJobs().filter(j=>state.savedJobs.some(s=>s.id===j.id));return baseHeader("Saved Jobs","Your shortlist of opportunities.")+`<div class="grid3">${jobCards(jobs)}</div>`;}
function renderApplications(){return baseHeader("Applications","Track every application from submission to outcome.",`<button class="btn" id="addAppBtn" type="button">+ Add application</button>`)+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Job</th><th>Company</th><th>Location</th><th>Date</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${state.applications.map(a=>`<tr><td>${esc(a.jobTitle)}</td><td>${esc(a.company)}</td><td>${esc(a.location)}</td><td>${esc(a.date||"")}</td><td><span class="badge ${String(a.status||"").toLowerCase()}">${esc(a.status)}</span></td><td>${esc(a.notes||"")}</td><td><button class="btn secondary small" data-edit-app="${esc(a.id)}" type="button">Edit</button> <button class="btn danger small" data-delete-app="${esc(a.id)}" type="button">Delete</button></td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">No applications yet. Add your first one.</div></td></tr>`}</tbody></table></div></div>`;}
function renderPipeline(){const cols=["Applied","Interview","Offer","Rejected"];return baseHeader("Pipeline","Move applications through your hiring stages.")+`<div class="grid3">${cols.map(c=>`<div class="card"><h3>${c}</h3>${state.applications.filter(a=>a.status===c).map(a=>`<div class="card" style="padding:12px;margin:10px 0"><strong>${esc(a.jobTitle)}</strong><div class="small muted">${esc(a.company)}</div><select data-pipeline="${esc(a.id)}" style="width:100%;margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:8px">${cols.map(x=>`<option ${x===c?"selected":""}>${x}</option>`).join("")}</select></div>`).join("")||`<div class="empty">Empty</div>`}</div>`).join("")}</div>`;}
function renderAnalytics(){const total=state.applications.length, interviews=state.applications.filter(a=>a.status==="Interview").length, offers=state.applications.filter(a=>a.status==="Offer").length, rejected=state.applications.filter(a=>a.status==="Rejected").length;const rate=total?Math.round(interviews/total*100):0;return baseHeader("Analytics","Simple performance insights from your tracked applications.")+`<div class="cards"><div class="card stat"><div class="label">Applications</div><div class="value">${total}</div></div><div class="card stat"><div class="label">Interview rate</div><div class="value">${rate}%</div></div><div class="card stat"><div class="label">Offers</div><div class="value">${offers}</div></div><div class="card stat"><div class="label">Rejected</div><div class="value">${rejected}</div></div></div><div class="card" style="margin-top:18px"><h3>Interview progress</h3><div class="progress"><span style="width:${rate}%"></span></div><p class="muted">${interviews} of ${total} applications have reached interview stage.</p></div>`;}
function resumeData(){return state.resume||{name:state.profile.name||"",title:"",email:currentUser?.email||"",phone:"",location:"",skills:"",experience:"",education:"",projects:"",certifications:""};}
function renderResume(){const r=resumeData();const locked=!hasAccess("resume");return baseHeader("Resume Builder","Create a clean, print-friendly resume.")+`<div class="grid2"><div class="card ${locked?"locked":""}">${locked?lockOverlay("Resume Builder is available during your trial or with Premium."):``}<form id="resumeForm"><div class="form-grid"><div class="field"><label>Name</label><input name="name" value="${esc(r.name)}" required></div><div class="field"><label>Professional title</label><input name="title" value="${esc(r.title)}"></div><div class="field"><label>Email</label><input name="email" value="${esc(r.email)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(r.phone)}"></div><div class="field full"><label>Location</label><input name="location" value="${esc(r.location)}"></div><div class="field full"><label>Skills</label><textarea name="skills">${esc(r.skills)}</textarea></div><div class="field full"><label>Experience</label><textarea name="experience">${esc(r.experience)}</textarea></div><div class="field full"><label>Education</label><textarea name="education">${esc(r.education)}</textarea></div><div class="field full"><label>Projects</label><textarea name="projects">${esc(r.projects)}</textarea></div><div class="field full"><label>Certifications</label><textarea name="certifications">${esc(r.certifications)}</textarea></div></div><div class="actions"><button class="btn" type="submit">Save Resume</button><button class="btn secondary" id="loadResume" type="button">Load Resume</button><button class="btn ghost" id="clearResume" type="button">Clear</button><button class="btn ghost" id="printResume" type="button">Print / PDF</button></div></form></div><div class="card"><h3>Preview</h3><div id="resumePreview">${resumePreview(r)}</div></div></div>`;}
function resumePreview(r){return`<div class="resume"><h1>${esc(r.name)||"Your Name"}</h1><p><strong>${esc(r.title)||"Professional Title"}</strong></p><p class="small">${esc(r.email)} ${r.phone?"• "+esc(r.phone):""} ${r.location?"• "+esc(r.location):""}</p>${["skills","experience","education","projects","certifications"].map(k=>r[k]?`<section><h2>${k.toUpperCase()}</h2><div class="resume-section">${esc(r[k])}</div></section>`:"").join("")}</div>`;}
function lockOverlay(t){return`<div class="lock-overlay"><div><h3>🔒 Premium</h3><p>${esc(t)}</p><button class="btn" data-nav="settings" type="button">View ₹499 Premium</button></div></div>`;}
function renderCover(){const locked=!hasAccess("cover");return baseHeader("Cover Letter Builder","Generate a tailored first draft you can edit.")+`<div class="grid2"><div class="card ${locked?"locked":""}">${locked?lockOverlay("Cover Letter Builder is available during your trial or with Premium."):``}<form id="coverForm"><div class="form-grid"><div class="field"><label>Job title</label><input id="coverJob" required></div><div class="field"><label>Company</label><input id="coverCompany" required></div><div class="field"><label>Candidate name</label><input id="coverName" value="${esc(state.profile.name||"")}"></div><div class="field"><label>Experience</label><input id="coverExperience"></div><div class="field full"><label>Skills</label><textarea id="coverSkills"></textarea></div></div><button class="btn" type="submit">Generate cover letter</button></form></div><div class="card"><h3>Cover letter</h3><div id="coverOutput" class="cover-output muted">Your generated letter will appear here.</div><div class="actions"><button class="btn secondary" id="copyCover" type="button">Copy</button><button class="btn ghost" id="clearCover" type="button">Clear</button></div></div></div>`;}
const interviewQuestions=[
"Tell me about yourself and your current goals.",
"Why are you interested in this role?",
"Describe a project you are proud of.",
"What is one skill you are actively improving?",
"How do you handle a difficult deadline?"
];
function renderInterview(){const locked=!hasAccess("interview"),q=interviewQuestions[interviewIndex];const ans=interviewAnswers[interviewIndex]||"";const progress=Math.round(((interviewIndex+1)/interviewQuestions.length)*100);return baseHeader("Interview Prep","Practice common questions and track your progress.")+`<div class="grid2"><div class="card ${locked?"locked":""}">${locked?lockOverlay("Interview preparation is available during your trial or with Premium."):``}<div class="small muted">Question ${interviewIndex+1} of ${interviewQuestions.length}</div><div class="progress" style="margin:10px 0"><span style="width:${progress}%"></span></div><h2>${esc(q)}</h2><textarea id="interviewAnswer" placeholder="Type your answer...">${esc(ans)}</textarea><div class="actions"><button class="btn ghost" id="prevQ" type="button">Previous</button><button class="btn" id="nextQ" type="button">Next</button></div></div><div class="card"><h3>Preparation tips</h3><ul><li>Use specific examples.</li><li>Keep answers structured and concise.</li><li>Connect your skills to the role.</li><li>Practice aloud and review your answers.</li></ul><h3>Score</h3><div class="value" style="font-size:2rem;font-weight:800">${interviewScore}/${interviewQuestions.length}</div></div></div>`;}
function renderProfile(){return baseHeader("Profile","Keep your career profile ready for applications.")+`<div class="card"><div style="display:flex;gap:15px;align-items:center;margin-bottom:20px"><div class="profile-avatar">${esc((state.profile.name||currentUser?.email||"U").slice(0,1).toUpperCase())}</div><div><h3 style="margin:0">${esc(state.profile.name||"Your profile")}</h3><div class="muted">${esc(currentUser?.email||"")}</div></div></div><form id="profileForm"><div class="form-grid"><div class="field"><label>Full name</label><input name="name" value="${esc(state.profile.name||"")}"></div><div class="field"><label>Professional title</label><input name="title" value="${esc(state.profile.title||"")}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(state.profile.phone||"")}"></div><div class="field"><label>Location</label><input name="location" value="${esc(state.profile.location||"")}"></div></div><button class="btn" type="submit">Save profile</button></form></div>`;}
function renderSettings(){return baseHeader("Settings","Account, theme and Premium activation.")+`<div class="grid2"><div class="card"><h3>Appearance</h3><p class="muted">Choose a comfortable workspace theme.</p><button class="btn secondary" id="toggleTheme" type="button">Toggle dark mode</button></div><div class="card"><h3>Premium</h3><p><strong>₹${CONFIG.premiumPrice}</strong> — Premium access</p><div class="card" style="margin:12px 0;padding:14px;background:var(--bg);border:1px solid var(--border)"><strong>Pay via UPI</strong><div style="font-size:1.1rem;font-weight:800;margin-top:6px;word-break:break-all">8374506945@fam</div><p class="small muted" style="margin-bottom:0">After payment, enter your UPI transaction/reference ID below. Payment is not considered verified until server-side verification is completed.</p></div><p class="muted">${esc(statusLabel())}</p>${isPremium()?`<div class="success">Premium access is active.</div>`:`<div class="field"><label>UPI transaction/reference ID</label><input id="paymentRef" placeholder="Enter reference for review"></div><button class="btn" id="submitPayment" type="button">Submit activation request</button><p class="small muted">Entering a reference does not itself verify payment. Server-side payment verification should be connected before granting secure paid access.</p>`}</div></div><div class="card" style="margin-top:18px"><h3>Data & account</h3><p class="muted">JobFlow AI keeps a local fallback so your workspace remains usable if Supabase is unavailable.</p><button class="btn danger" id="clearLocal" type="button">Clear local workspace</button></div>`;}

function bindPageEvents(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.nav)));
  const form=$("jobSearchForm");if(form)form.addEventListener("submit",async e=>{e.preventDefault();if(realJobsLoading)return;const q=($("jobQuery").value||"").trim(),l=($("jobLocation").value||"").trim(),category=$("jobCategory")?.value||"All",days=$("jobDays")?.value||"30";realJobsLoading=true;const status=$("realJobsStatus");if(status)status.textContent="Loading live jobs…";const results=$("jobResults");if(results)results.innerHTML=`<div class="card empty" style="grid-column:1/-1">Loading live jobs…</div>`;try{const jobs=await fetchRealJobs({q,location:l,category,days});state.jobs=jobs;saveLocal();if(results)results.innerHTML=jobCards(jobs);if(status)status.textContent=`Showing ${jobs.length} current matching jobs from the live job source. Use the company-site Apply button to submit directly where available.`;bindJobButtons();}catch(err){console.error(err);const fallback=getJobs().filter(j=>(!q||[j.title,j.company,j.description,...j.skills].join(" ").toLowerCase().includes(q.toLowerCase()))&&(!l||j.location.toLowerCase().includes(l.toLowerCase())));if(results)results.innerHTML=jobCards(fallback);if(status)status.textContent="Live job service is temporarily unavailable. Showing saved/local jobs instead.";toast("Live jobs could not be loaded. Local jobs are still available.","error");}finally{realJobsLoading=false;}});
  if($("resetJobs"))$("resetJobs").addEventListener("click",()=>{navigate("jobs")});
  bindJobButtons();
  document.querySelectorAll("[data-edit-app]").forEach(b=>b.addEventListener("click",()=>editApplication(b.dataset.editApp)));
  document.querySelectorAll("[data-delete-app]").forEach(b=>b.addEventListener("click",()=>deleteApplication(b.dataset.deleteApp)));
  document.querySelectorAll("[data-pipeline]").forEach(s=>s.addEventListener("change",()=>{const a=state.applications.find(x=>x.id===s.dataset.pipeline);if(a){a.status=s.value;saveLocal();syncApplication(a);renderPage();toast("Pipeline updated.","success")}}));
  if($("addAppBtn"))$("addAppBtn").addEventListener("click",()=>showApplicationForm());
  if($("resumeForm"))$("resumeForm").addEventListener("submit",saveResume);
  if($("loadResume"))$("loadResume").addEventListener("click",()=>{state.resume=resumeData();$("resumeForm").querySelectorAll("input,textarea").forEach(el=>{if(el.name)el.value=state.resume[el.name]||""});toast("Resume loaded.","success")});
  if($("clearResume"))$("clearResume").addEventListener("click",()=>{state.resume=null;localStorage.removeItem(LS.resume);renderPage();toast("Resume cleared.","success")});
  if($("printResume"))$("printResume").addEventListener("click",printResume);
  if($("coverForm"))$("coverForm").addEventListener("submit",generateCover);
  if($("copyCover"))$("copyCover").addEventListener("click",async()=>{const text=$("coverOutput").textContent;if(!text||text.includes("will appear"))return toast("Generate a letter first.","error");try{await navigator.clipboard.writeText(text);toast("Copied.","success")}catch(e){toast("Copy is unavailable in this browser.","error")}});
  if($("clearCover"))$("clearCover").addEventListener("click",()=>{$("coverOutput").textContent="Your generated letter will appear here."});
  if($("prevQ"))$("prevQ").addEventListener("click",()=>{saveInterviewAnswer();if(interviewIndex>0)interviewIndex--;renderPage()});
  if($("nextQ"))$("nextQ").addEventListener("click",()=>{saveInterviewAnswer();if(interviewIndex<interviewQuestions.length-1){interviewIndex++;renderPage()}else{toast("Interview practice completed.","success")}});  
  if($("profileForm"))$("profileForm").addEventListener("submit",saveProfile);
  if($("toggleTheme"))$("toggleTheme").addEventListener("click",toggleTheme);
  if($("submitPayment"))$("submitPayment").addEventListener("click",submitPayment);
  if($("clearLocal"))$("clearLocal").addEventListener("click",()=>{if(confirm("Clear locally stored JobFlow data?")){localStorage.removeItem(LS.data);state={jobs:sampleJobs(),savedJobs:[],applications:[],profile:{},subscription:null,resume:null};saveLocal();renderPage();toast("Local workspace cleared.","success")}});
}
function bindJobButtons(){document.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",()=>toggleSave(b.dataset.save)));document.querySelectorAll("[data-track]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.track;const existing=state.applications.find(a=>a.jobId===id);if(existing){navigate("applications")}else showApplicationForm(id)}));}
function toggleSave(id){const j=getJobs().find(x=>x.id===id);if(!j)return;if(state.savedJobs.some(x=>x.id===id)){state.savedJobs=state.savedJobs.filter(x=>x.id!==id);toast("Removed from saved jobs.")}else{state.savedJobs.push({id:j.id,title:j.title,company:j.company,location:j.location});toast("Job saved.","success")}saveLocal();renderPage();}
function showApplicationForm(jobId=""){const j=getJobs().find(x=>x.id===jobId)||{};const html=`<div class="card" style="position:fixed;inset:8%;z-index:80;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)"><div class="page-title"><h2>${jobId?"Add application":"Add application"}</h2><button class="btn ghost" id="closeModal" type="button">Close</button></div><form id="appForm"><div class="form-grid"><div class="field"><label>Job title</label><input name="jobTitle" value="${esc(j.title||"")}" required></div><div class="field"><label>Company</label><input name="company" value="${esc(j.company||"")}" required></div><div class="field"><label>Location</label><input name="location" value="${esc(j.location||"")}"></div><div class="field"><label>Application date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Status</label><select name="status">${["Applied","Interview","Offer","Rejected"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div></div><button class="btn" type="submit">Save application</button></form></div>`;const overlay=document.createElement("div");overlay.id="modalOverlay";overlay.style.cssText="position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:70";overlay.innerHTML=html;document.body.appendChild(overlay);$("closeModal").addEventListener("click",()=>overlay.remove());$("appForm").addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(e.target);const app={id:uid(),jobId:jobId||uid(),jobTitle:fd.get("jobTitle"),company:fd.get("company"),location:fd.get("location"),date:fd.get("date"),status:fd.get("status"),notes:fd.get("notes")};state.applications.push(app);saveLocal();syncApplication(app);overlay.remove();renderPage();toast("Application added.","success")});}
function editApplication(id){const a=state.applications.find(x=>x.id===id);if(!a)return;showApplicationForm();const form=$("appForm");Object.keys(a).forEach(k=>{if(form.elements[k])form.elements[k].value=a[k]||""});form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);Object.assign(a,{jobTitle:fd.get("jobTitle"),company:fd.get("company"),location:fd.get("location"),date:fd.get("date"),status:fd.get("status"),notes:fd.get("notes")});saveLocal();syncApplication(a);$("modalOverlay")?.remove();renderPage();toast("Application updated.","success")};}
function deleteApplication(id){if(!confirm("Delete this application?"))return;state.applications=state.applications.filter(a=>a.id!==id);saveLocal();deleteRemoteApplication(id);renderPage();toast("Application deleted.","success");}
function saveResume(e){e.preventDefault();if(!hasAccess("resume"))return toast("Premium access required.","error");const fd=new FormData(e.target);state.resume=Object.fromEntries(fd.entries());localStorage.setItem(LS.resume,JSON.stringify(state.resume));saveLocal();renderPage();toast("Resume saved.","success");}
function printResume(){const r=resumeData();const w=window.open("","_blank","width=900,height=800");if(!w)return toast("Please allow pop-ups to print the resume.","error");w.document.write(`<html><head><title>${esc(r.name||"Resume")}</title><style>body{font-family:Arial,sans-serif;padding:40px;color:#111}h1{margin:0}h2{font-size:15px;border-bottom:1px solid #ddd;padding-bottom:4px;margin-top:22px}.resume-section{white-space:pre-wrap;line-height:1.5}</style></head><body>${resumePreview(r)}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300);}
function generateCover(e){e.preventDefault();if(!hasAccess("cover"))return toast("Premium access required.","error");const job=$("coverJob").value.trim(),company=$("coverCompany").value.trim(),name=$("coverName").value.trim()||"Candidate",skills=$("coverSkills").value.trim(),exp=$("coverExperience").value.trim();$("coverOutput").textContent=`Dear Hiring Manager,

I am writing to express my interest in the ${job} position at ${company}. I am enthusiastic about the opportunity to contribute my skills and learn in a professional environment.

My key skills include ${skills||"communication, problem-solving and teamwork"}. ${exp?`My experience includes ${exp}. `:"I am motivated to apply my abilities to real-world projects and deliver dependable results."}

I would welcome the opportunity to discuss how my background and motivation could contribute to ${company}. Thank you for considering my application.

Sincerely,
${name}`;toast("Cover letter generated.","success");}
function saveInterviewAnswer(){if(!hasAccess("interview"))return;const a=$("interviewAnswer");if(a)interviewAnswers[interviewIndex]=a.value.trim();if(interviewAnswers[interviewIndex])interviewScore=Math.min(interviewQuestions.length,Object.values(interviewAnswers).filter(Boolean).length);}
function saveProfile(e){e.preventDefault();const fd=new FormData(e.target);state.profile={...state.profile,...Object.fromEntries(fd.entries())};saveLocal();syncProfile();renderPage();toast("Profile saved.","success");}
function toggleTheme(){const dark=document.body.classList.toggle("dark");localStorage.setItem(LS.theme,dark?"dark":"light");toast(dark?"Dark mode enabled.":"Light mode enabled.","success");}
function applyTheme(){if(localStorage.getItem(LS.theme)==="dark")document.body.classList.add("dark");}
function submitPayment(){const ref=$("paymentRef").value.trim();if(!ref)return toast("Enter a payment reference first.","error");toast("Activation request recorded locally. Payment is not marked verified.","info");localStorage.setItem("jobflow_payment_request",JSON.stringify({reference:ref,createdAt:new Date().toISOString(),user:currentUser?.email||""}));}
function startTrialIfNeeded(){if(!state.profile.trialStartedAt){const start=new Date(),end=new Date(start.getTime()+CONFIG.trialHours*3600000);state.profile.trialStartedAt=start.toISOString();state.profile.trialEndsAt=end.toISOString();saveLocal();}}
async function initSupabase(){try{if(window.supabase?.createClient){supabaseClient=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const res=await supabaseClient.auth.getSession();if(res.data?.session){await setSession(res.data.session)}supabaseClient.auth.onAuthStateChange((_event,s)=>{if(s)setSession(s);else if(currentUser)logoutLocal(false)});return true}}catch(e){console.warn("Supabase unavailable",e)}return false;}
async function setSession(s){session=s;currentUser=s?.user||null;if(!currentUser)return;loadLocal();startTrialIfNeeded();await syncFromSupabase();showApp();}
function showAuth(){ $("authView").classList.remove("hidden");$("appView").classList.add("hidden");}
function showApp(){$("authView").classList.add("hidden");$("appView").classList.remove("hidden");$("welcomeText").textContent="Hi, "+(state.profile.name||currentUser?.email?.split("@")[0]||"there");$("statusText").textContent=statusLabel();renderNav();renderPage();}
async function handleAuth(e){e.preventDefault();$("authSubmit").disabled=true;$("authMessage").textContent="";const email=$("authEmail").value.trim(),password=$("authPassword").value,name=$("authName").value.trim();try{if(!supabaseClient)throw new Error("Authentication service is unavailable. You can still use the local workspace, but account login needs Supabase.");let result;if(authMode==="login"){result=await supabaseClient.auth.signInWithPassword({email,password})}else{result=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name}}})}if(result.error)throw result.error;if(result.data.session){await setSession(result.data.session);toast(authMode==="login"?"Logged in successfully.":"Account created successfully.","success")}else{toast("Account created. Check your email if confirmation is enabled.","success");setAuthMode("login")}}catch(err){$("authMessage").textContent=err.message||"Authentication failed."}finally{$("authSubmit").disabled=false;}}
function setAuthMode(mode){authMode=mode;const signup=mode==="signup";$("loginTab").classList.toggle("active",!signup);$("signupTab").classList.toggle("active",signup);$("nameField").classList.toggle("hidden",!signup);$("authSubmit").textContent=signup?"Create account":"Login";$("authTitle").textContent=signup?"Create your account":"Welcome back";$("authSubtitle").textContent=signup?"Start your 48-hour free trial.":"Manage your job search in one place.";$("authPassword").autocomplete=signup?"new-password":"current-password";$("authMessage").textContent="";}
async function logout(){try{if(supabaseClient)await supabaseClient.auth.signOut()}catch(e){console.warn(e)}logoutLocal(true)}
function logoutLocal(show){session=null;currentUser=null;state={jobs:sampleJobs(),savedJobs:[],applications:[],profile:{},subscription:null,resume:null};if(show)toast("Logged out.","success");showAuth();}
async function syncFromSupabase(){if(!supabaseClient||!currentUser)return;try{const [p,a,s,sub]=await Promise.all([supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle(),supabaseClient.from("applications").select("*").eq("user_id",currentUser.id),supabaseClient.from("saved_jobs").select("*").eq("user_id",currentUser.id),supabaseClient.from("subscriptions").select("*").eq("user_id",currentUser.id).maybeSingle()]);if(!p.error&&p.data)state.profile={...state.profile,...p.data};if(!a.error&&Array.isArray(a.data))state.applications=a.data.map(normalizeApp);if(!s.error&&Array.isArray(s.data))state.savedJobs=s.data.map(x=>({id:x.job_id||x.id,title:x.title||"",company:x.company||"",location:x.location||""}));if(!sub.error&&sub.data)state.subscription=normalizeSubscription(sub.data);saveLocal()}catch(e){console.warn("Supabase sync skipped",e)}}
function normalizeApp(a){return{id:a.id||uid(),jobId:a.job_id||a.jobId||"",jobTitle:a.job_title||a.jobTitle||"",company:a.company||"",location:a.location||"",date:a.application_date||a.date||"",status:a.status||"Applied",notes:a.notes||""}}
function normalizeSubscription(s){return{status:s.status||"inactive",plan:s.plan||"premium",expiresAt:s.expires_at||s.expiresAt||null}}
async function syncProfile(){if(!supabaseClient||!currentUser)return;try{const payload={id:currentUser.id,email:currentUser.email,name:state.profile.name||null,title:state.profile.title||null,phone:state.profile.phone||null,location:state.profile.location||null,trial_started_at:state.profile.trialStartedAt||null,trial_ends_at:state.profile.trialEndsAt||null};const r=await supabaseClient.from("profiles").upsert(payload,{onConflict:"id"});if(r.error)console.warn("Profile sync:",r.error.message)}catch(e){console.warn(e)}}
async function syncApplication(a){if(!supabaseClient||!currentUser)return;try{const payload={id:a.id,user_id:currentUser.id,job_id:a.jobId,job_title:a.jobTitle,company:a.company,location:a.location,application_date:a.date,status:a.status,notes:a.notes};const r=await supabaseClient.from("applications").upsert(payload,{onConflict:"id"});if(r.error)console.warn("Application sync:",r.error.message)}catch(e){console.warn(e)}}
async function deleteRemoteApplication(id){if(!supabaseClient||!currentUser)return;try{const r=await supabaseClient.from("applications").delete().eq("id",id).eq("user_id",currentUser.id);if(r.error)console.warn(r.error.message)}catch(e){console.warn(e)}}

function bindGlobal(){ $("loginTab").addEventListener("click",()=>setAuthMode("login"));$("signupTab").addEventListener("click",()=>setAuthMode("signup"));$("authForm").addEventListener("submit",handleAuth);$("logoutBtn").addEventListener("click",logout);$("themeBtn").addEventListener("click",toggleTheme);$("sideNav").addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(b)navigate(b.dataset.nav)});$("mobileNav").addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(b)navigate(b.dataset.nav)});$("mobileMenuBtn").addEventListener("click",()=>toast("Use the navigation available on desktop; mobile navigation is at the bottom.","info"));}
async function boot(){applyTheme();loadLocal();bindGlobal();renderNav();const ok=await initSupabase();if(!ok){$("authMessage").textContent="Supabase is currently unavailable. Local workspace mode is available after using the demo workspace.";const localBtn=document.createElement("button");localBtn.className="btn secondary";localBtn.type="button";localBtn.textContent="Continue locally";localBtn.style.width="100%";localBtn.style.marginTop="8px";localBtn.addEventListener("click",()=>{currentUser={email:"local@jobflow.ai"};startTrialIfNeeded();showApp();toast("Local workspace started.","success")});$("authForm").after(localBtn)}}
boot();
})();
</script>
</body>
</html>
