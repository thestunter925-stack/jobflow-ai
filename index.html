/* =========================
   APPLICATION STATE
   ========================= */
const DEFAULT_STATE = {
  name:"Learner",xp:0,streak:0,lastActive:"",completedLessons:[],courseProgress:{},
  quizCount:0,gamesFinished:0,finishedGames:[],completedProjects:[],roadmapProgress:0,
  theme:"dark",lessonCourse:null,lessonIndex:0,gameStats:{}
};
let state = {...DEFAULT_STATE};

function loadState(){
  try{
    const raw=localStorage.getItem("codeforge_state_v1");
    if(raw) state={...DEFAULT_STATE,...JSON.parse(raw)};
  }catch(e){console.error("State load failed:",e); toast("Saved progress could not be loaded.");}
  if(!Array.isArray(state.completedLessons)) state.completedLessons=[];
  if(!Array.isArray(state.finishedGames)) state.finishedGames=[];
  if(!Array.isArray(state.completedProjects)) state.completedProjects=[];
  if(!state.courseProgress || typeof state.courseProgress!=="object") state.courseProgress={};
  updateStreak();
}
function saveState(){
  try{localStorage.setItem("codeforge_state_v1",JSON.stringify(state));}
  catch(e){console.error("State save failed:",e);toast("Browser storage is unavailable.");}
}
function updateStreak(){
  const today=new Date().toISOString().slice(0,10);
  if(state.lastActive===today)return;
  if(!state.lastActive){state.streak=1;}
  else{
    const a=new Date(state.lastActive),b=new Date(today);
    const diff=Math.round((b-a)/86400000);
    if(diff===1)state.streak=Math.max(1,state.streak+1);
    else if(diff>1)state.streak=1;
  }
  state.lastActive=today; saveState();
}
function levelInfo(){
  const level=Math.min(7,Math.floor(state.xp/250)+1);
  const labels=["Intern","Junior Developer","Developer","Software Engineer","Senior Engineer","Staff Engineer","Principal Engineer"];
  const currentFloor=(level-1)*250,next=level===7?2500:level*250;
  return {level,label:labels[level-1],floor:currentFloor,next,percent:Math.min(100,Math.round(((state.xp-currentFloor)/(next-currentFloor))*100))};
}
function addXP(amount,reason){
  state.xp=Math.max(0,state.xp+amount); saveState(); updateHeader();
  toast("+"+amount+" XP"+(reason?" · "+reason:""));
  renderAchievements();
}

/* =========================
   UTILITIES / DOM HELPERS
   ========================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function bindButton(selector,handler){
  const element=document.querySelector(selector);
  if(!element){console.warn("Missing element:",selector);return null;}
  element.addEventListener("click",handler); return element;
}
function toast(message){
  const el=$("#toast"); el.textContent=message; el.classList.add("show");
  clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove("show"),2800);
}
function openModal(content){
  $("#modalBox").innerHTML=content; $("#modal").classList.add("open"); $("#modal").setAttribute("aria-hidden","false");
}
function closeModal(){ $("#modal").classList.remove("open"); $("#modal").setAttribute("aria-hidden","true"); $("#modalBox").innerHTML=""; }
function courseId(name){return name.toLowerCase().replace(/[^a-z0-9]+/g,"-");}
function getCourse(name){return allCourses.find(c=>c[0]===name);}
function getLessons(course){
  const topics=course[4];
  return topics.map((topic,i)=>({
    title:topic,
    body: lessonBody(course[0],topic,i),
    code: lessonCode(course[0],topic,i),
    challenge:i===topics.length-1
  }));
}
function lessonBody(course,topic,i){
  const practical = [
    "Start with the smallest reproducible example, then change one variable at a time.",
    "Use meaningful names, explicit boundaries and tests around behavior that matters.",
    "When debugging, reproduce the issue, isolate the cause, apply the smallest safe fix and verify it.",
    "In a workplace codebase, explain the tradeoff in the pull request and leave enough context for the next engineer."
  ][i%4];
  return `<h2>${esc(topic)}</h2><p>This lesson introduces <b>${esc(topic)}</b> in the context of <b>${esc(course)}</b>. The goal is not memorization: understand the concept, practice it, and connect it to production engineering.</p><div class="notice"><b>Engineering habit:</b> ${practical}</div><h3 class="section">Learn → Practice → Build → Deploy → Maintain</h3><p>Learn the concept, practice with a small example, build a feature, think about how it is deployed, and identify what you would monitor or maintain after release.</p>`;
}
function lessonCode(course,topic,i){
  if(course==="Python") return `# ${topic}\ndef example(value):\n    if value is None:\n        return "missing"\n    return str(value)\n\nprint(example("CodeForge"))`;
  if(course==="SQL") return `SELECT department, COUNT(*) AS total\nFROM employees\nWHERE active = 1\nGROUP BY department\nORDER BY total DESC;`;
  if(course==="JavaScript") return `const button = document.querySelector("#save");\nbutton.addEventListener("click", () => {\n  console.log("Saved safely");\n});`;
  return `// ${course} — ${topic}\n// Practice the concept with a small, testable example.\nfunction example() {\n  return "Learn → Build → Verify";\n}`;
}

const App={
  currentView:"dashboard",
  initialized:false,
  navItems:[
    ["dashboard","▦","Dashboard"],["courses","📚","All Courses"],["learning","▶","My Learning"],
    ["playground","⌘","Code Playground"],["games","🎮","Game Hub"],["projects","🛠","Project Lab"],
    ["roadmaps","🗺","Career Roadmaps"],["interviews","🎯","Interview Lab"],["achievements","🏆","Achievements"],
    ["certificates","🎓","Certificates"],["settings","⚙","Settings"]
  ],
  init(){
    if(this.initialized)return;
    this.initialized=true; loadState(); applyTheme(); this.renderNav(); this.registerGlobalEvents();
    this.renderAll(); this.navigate("dashboard"); runSelfTest();
  },
  renderNav(){
    $("#mainNav").innerHTML=this.navItems.map(([id,icon,label])=>`<button type="button" data-nav="${id}" aria-label="${label}"><span class="icon">${icon}</span>${label}</button>`).join("");
  },
  navigate(view){
    if(!this.navItems.some(x=>x[0]===view))view="dashboard";
    this.currentView=view;
    $$(".view").forEach(v=>v.classList.remove("active"));
    const target=$("#view-"+view); if(target)target.classList.add("active");
    $$("[data-nav]").forEach(b=>b.classList.toggle("active",b.dataset.nav===view));
    const renderers={
      dashboard:renderDashboard,courses:renderCourses,learning:renderLearning,playground:renderPlayground,
      games:renderGames,projects:renderProjects,roadmaps:renderRoadmaps,interviews:renderInterviews,
      achievements:renderAchievements,certificates:renderCertificates,settings:renderSettings
    };
    if(renderers[view])renderers[view]();
    $("#sidebar").classList.remove("open"); window.scrollTo({top:0,behavior:"smooth"});
  },
  renderAll(){
    renderDashboard();renderCourses();renderLearning();renderPlayground();renderGames();renderProjects();
    renderRoadmaps();renderInterviews();renderAchievements();renderCertificates();renderSettings();updateHeader();
  },
  registerGlobalEvents(){
    $("#mainNav").addEventListener("click",e=>{
      const b=e.target.closest("[data-nav]"); if(b)this.navigate(b.dataset.nav);
    });
    bindButton("#menuBtn",()=>$("#sidebar").classList.toggle("open"));
    $("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
    const search=$("#globalSearch");
    search.addEventListener("input",()=>performSearch(search.value));
    search.addEventListener("focus",()=>{if(search.value.trim())performSearch(search.value);});
    document.addEventListener("click",e=>{
      if(!e.target.closest(".search"))$("#searchResults").classList.remove("open");
    });
  }
};

let courseFilter="All";
function renderCourses(){
  const cats=["All",...new Set(allCourses.map(c=>c[1]))];
  $("#view-courses").innerHTML=`<div class="row between"><div><h1>All Courses</h1><p>A structured A–Z software-engineering curriculum.</p></div><div class="row"><select id="courseFilter" aria-label="Filter courses">${cats.map(c=>`<option ${c===courseFilter?"selected":""}>${esc(c)}</option>`).join("")}</select></div></div>
  <div class="grid g4 section" id="courseGrid">${allCourses.map(courseCard).join("")}</div>`;
  $("#courseFilter").addEventListener("change",e=>{courseFilter=e.target.value;filterCourses();});
  $$("#courseGrid [data-course]").forEach(b=>{
    b.addEventListener("click",()=>openCourse(b.dataset.course));
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")openCourse(b.dataset.course);});
  });
}
function filterCourses(){
  const list=courseFilter==="All"?allCourses:allCourses.filter(c=>c[1]===courseFilter);
  $("#courseGrid").innerHTML=list.map(courseCard).join("");
  $$("#courseGrid [data-course]").forEach(b=>b.addEventListener("click",()=>openCourse(b.dataset.course)));
}
function openCourse(name){
  const c=getCourse(name); if(!c)return;
  const lessons=getLessons(c),id=courseId(name),progress=state.courseProgress[id]||0;
  openModal(`<div class="row between"><div><span class="tag">${esc(c[1])}</span><h2>${esc(c[0])}</h2><p>${esc(c[2])} · ${esc(c[3])}</p></div><button class="btn" data-close>Close</button></div>
  <div class="progress"><i style="width:${progress}%"></i></div><p>${progress}% complete · ${lessons.length} lessons</p>
  <div class="list">${lessons.map((l,i)=>`<button class="btn" data-open-lesson="${esc(name)}" data-index="${i}">${state.completedLessons.includes(name+"::"+l.title)?"✓":"○"} ${i+1}. ${esc(l.title)}</button>`).join("")}</div>`);
  $("#modalBox").addEventListener("click",e=>{
    if(e.target.closest("[data-close]"))closeModal();
    const b=e.target.closest("[data-open-lesson]"); if(b){closeModal();openLesson(b.dataset.openLesson,Number(b.dataset.index));}
  });
}
function openLesson(name,index){
  const c=getCourse(name);if(!c)return;
  state.lessonCourse=name;state.lessonIndex=index;
  App.navigate("learning");
  renderLessonView();
}
function renderLearning(){
  if(!state.lessonCourse){
    const inProgress=allCourses.find(c=>(state.courseProgress[courseId(c[0])]||0)>0) || allCourses[0];
    state.lessonCourse=inProgress[0];state.lessonIndex=0;
  }
  renderLessonView();
}
function renderLessonView(){
  const c=getCourse(state.lessonCourse)||allCourses[0],lessons=getLessons(c),i=Math.max(0,Math.min(state.lessonIndex,lessons.length-1)),l=lessons[i];
  state.lessonIndex=i;
  const done=state.completedLessons.includes(c[0]+"::"+l.title);
  $("#view-learning").innerHTML=`<div class="row between"><div><span class="tag">MY LEARNING</span><h1>${esc(c[0])}</h1><p>${esc(c[1])} · ${i+1}/${lessons.length}</p></div><button class="btn" data-action="course-picker">Change course</button></div>
  <div class="lesson-layout section"><aside class="card lesson-sidebar"><h3>Lessons</h3><div class="list">${lessons.map((x,n)=>`<button class="lesson-item ${n===i?"active":""}" data-lesson-index="${n}">${state.completedLessons.includes(c[0]+"::"+x.title)?"✓":"○"} ${n+1}. ${esc(x.title)}</button>`).join("")}</div></aside>
  <article class="card"><div class="row between"><div><span class="tag">${esc(c[2])}</span><span class="tag">${esc(c[3])}</span></div><span class="muted small">${done?"Completed":"In progress"}</span></div>${l.body}<div class="section"><h3>Example</h3><div class="code">${esc(l.code)}</div></div>
  <div class="section"><h3>Mini challenge</h3><p>Which workflow is most reliable for a production bug?</p><div class="row" id="lessonChallenge"><button class="btn" data-choice="bad">Rewrite everything</button><button class="btn" data-choice="good">Reproduce → isolate → fix → verify</button></div><div id="lessonFeedback"></div></div>
  <div class="row between section"><button class="btn" data-action="prev" ${i===0?"disabled":""}>← Previous</button><div class="row"><button class="btn ${done?"good":"primary"}" data-action="complete">${done?"✓ Completed":"Complete lesson +50 XP"}</button><button class="btn" data-action="next" ${i===lessons.length-1?"disabled":""}>Next →</button></div></div></article></div>`;
  $$("#view-learning [data-lesson-index]").forEach(b=>b.addEventListener("click",()=>{state.lessonIndex=Number(b.dataset.lessonIndex);renderLessonView();}));
  bindButton("#view-learning [data-action='course-picker']",()=>openCourse(c[0]));
  bindButton("#view-learning [data-action='prev']",()=>{state.lessonIndex--;renderLessonView();});
  bindButton("#view-learning [data-action='next']",()=>{state.lessonIndex++;renderLessonView();});
  bindButton("#view-learning [data-action='complete']",()=>completeLesson(c[0],l.title));
  $$("#lessonChallenge [data-choice]").forEach(b=>b.addEventListener("click",()=>{
    $("#lessonFeedback").innerHTML=b.dataset.choice==="good"?'<div class="notice good section">Correct. +10 XP — this is a reusable debugging workflow.</div>':'<div class="notice bad section">Try again. Avoid large rewrites before reproducing and isolating the cause.</div>';
    if(b.dataset.choice==="good")addXP(10,"lesson challenge");
  }));
}
function completeLesson(course,topic){
  const key=course+"::"+topic;
  if(!state.completedLessons.includes(key)){
    state.completedLessons.push(key); state.quizCount++;
    const c=getCourse(course),done=state.completedLessons.filter(x=>x.startsWith(course+"::")).length;
    state.courseProgress[courseId(course)]=Math.round(done/getLessons(c).length*100);
    if(topic.toLowerCase().includes("api"))state.roadmapProgress++;
    saveState();addXP(50,"lesson completed");
  }else toast("Lesson already completed.");
  renderLessonView();renderDashboard();
}
function openDailyMission(){

/* =========================
   PLAYGROUND
   ========================= */
function renderPlayground(){
  $("#view-playground").innerHTML=`<div><h1>Code Playground</h1><p>Run JavaScript locally in your browser. Python, SQL and pseudocode are practice/simulation modes unless a compatible runtime is available.</p></div>
  <div class="card section"><div class="row between"><div class="row"><select id="playLang" aria-label="Playground language"><option>JavaScript</option><option>HTML/CSS</option><option>Python practice</option><option>SQL practice</option><option>Pseudocode</option></select><button class="btn" id="playReset">Reset</button><button class="btn" id="playClear">Clear</button><button class="btn primary" id="playRun">▶ Run</button></div><span class="tag" id="playMode">Executable in browser</span></div>
  <div class="playgrid section"><textarea class="editor" id="playEditor" spellcheck="false"></textarea><div><div class="code output" id="playOutput">Output will appear here.</div><div class="notice section" id="playHint"></div></div></div></div>`;
  const defaults={
    "JavaScript":`const numbers = [2, 4, 6];\nconst total = numbers.reduce((a,b) => a + b, 0);\nconsole.log("Total:", total);`,
    "HTML/CSS":`<h2>Hello CodeForge</h2>\n<p>Edit this HTML and run it.</p>`,
    "Python practice":"numbers = [2, 4, 6]\\nprint(sum(numbers))",
    "SQL practice":"SELECT department, COUNT(*) AS total\\nFROM employees\\nGROUP BY department;",
    "Pseudocode":"START\\n  READ numbers\\n  CALCULATE total\\n  PRINT total\\nEND"
  };
  const editor=$("#playEditor"),out=$("#playOutput"),lang=$("#playLang"),mode=$("#playMode"),hint=$("#playHint");
  function setLang(){
    const v=lang.value;editor.value=defaults[v];out.textContent="Output will appear here.";
    const executable=v==="JavaScript";mode.textContent=executable?"Executable in browser":"Practice / simulation mode";
    hint.textContent=executable?"JavaScript is executed locally with a captured console.":"This mode is intentionally not described as real execution because this standalone file has no Python/SQL backend runtime.";
  }
  setLang();
  lang.addEventListener("change",setLang);
  $("#playReset").addEventListener("click",setLang);
  $("#playClear").addEventListener("click",()=>{editor.value="";out.textContent="Cleared.";});
  $("#playRun").addEventListener("click",()=>{
    if(lang.value==="JavaScript")runJS(editor.value,out);
    else if(lang.value==="HTML/CSS")runHTML(editor.value,out);
    else {out.textContent="Practice mode only.\n\nYour submitted content:\n"+editor.value;}
  });
}
function runJS(source,out){
  const logs=[];const original=console.log;
  try{
    console.log=(...args)=>logs.push(args.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" "));
    const result=(new Function(source))();
    if(result!==undefined)logs.push(String(result));
    out.textContent=logs.join("\n")||"Code ran successfully with no console output.";
  }catch(e){out.textContent="Error: "+e.message;console.error(e);}
  finally{console.log=original;}
}
function runHTML(source,out){
  out.innerHTML="";
  const frame=document.createElement("iframe");frame.sandbox="";frame.style.width="100%";frame.style.minHeight="240px";frame.style.border="1px solid var(--line)";frame.style.borderRadius="10px";out.appendChild(frame);
  frame.srcdoc=source;
}

/* =========================
   GAME ENGINE
   ========================= */
const GameEngine={
  activeGame:null,questionIndex:0,score:0,xp:0,lives:3,combo:0,answered:false,
  start(gameId){
    if(!games[gameId]){toast("Game not found.");return;}
    this.activeGame=gameId;this.questionIndex=0;this.score=0;this.xp=0;this.lives=3;this.combo=0;this.answered=false;
    App.navigate("games");this.render();
  },
  render(){
    if(!this.activeGame){renderGames();return;}
    const g=games[this.activeGame],q=g.questions[this.questionIndex];
    $("#view-games").innerHTML=`<div class="row between"><div><span class="tag">${esc(g.icon)} ${esc(g.name)}</span><h1>Challenge ${this.questionIndex+1}/${g.questions.length}</h1><p>${esc(g.desc)}</p></div><button class="btn" id="exitGame">Exit</button></div>
    <div class="grid g2 section"><div class="card"><div class="row between"><span>Score <b>${this.score}</b></span><span>❤️ ${this.lives}</span><span>Combo ×${this.combo}</span></div><div class="progress section"><i style="width:${(this.questionIndex/g.questions.length)*100}%"></i></div></div><div class="card"><span class="muted">XP earned this run</span><strong style="font-size:28px">${this.xp}</strong></div></div>
    <div class="card section"><h2>${esc(q[0])}</h2><div class="grid g2 section">${q[1].map((a,i)=>`<button class="btn" data-answer="${i}" ${this.answered?"disabled":""}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join("")}</div><div id="gameFeedback" class="section"></div></div>`;
    bindButton("#exitGame",()=>this.exit());
    $$("#view-games [data-answer]").forEach(b=>b.addEventListener("click",()=>this.answer(Number(b.dataset.answer))));
  },
  answer(index){
    if(this.answered||!this.activeGame)return;
    this.answered=true;
    const q=games[this.activeGame].questions[this.questionIndex],correct=index===q[2];
    if(correct){this.combo++;this.score+=100+this.combo*20;this.xp+=25+this.combo*5;$("#gameFeedback").innerHTML='<div class="notice good">Correct! Strong engineering choice. +XP</div>';}
    else{this.combo=0;this.lives--;$("#gameFeedback").innerHTML=`<div class="notice bad">Not quite. Correct answer: <b>${esc(q[1][q[2]])}</b></div>`;}
    $$("#view-games [data-answer]").forEach(b=>b.disabled=true);
    const wrap=$("#gameFeedback");const next=document.createElement("button");next.className="btn primary";next.style.marginTop="12px";next.textContent=this.questionIndex===games[this.activeGame].questions.length-1||this.lives<=0?"Finish":"Next question";next.addEventListener("click",()=>this.next());wrap.appendChild(next);
  },
  next(){
    if(!this.activeGame)return;
    const g=games[this.activeGame];
    if(this.lives<=0||this.questionIndex>=g.questions.length-1){this.finish();return;}
    this.questionIndex++;this.answered=false;this.render();
  },
  finish(){
    const id=this.activeGame,g=games[id];
    if(!state.finishedGames.includes(id)){state.finishedGames.push(id);state.gamesFinished++;addXP(this.xp,"game finished");}
    else toast("Game completed again. Score recorded for this run.");
    state.gameStats[id]={score:this.score,lastPlayed:new Date().toISOString()};
    saveState();
    $("#view-games").innerHTML=`<div class="hero"><span class="tag">${esc(g.icon)} ${esc(g.name)}</span><h1>Run complete</h1><p>Your score: <b>${this.score}</b> · XP earned: <b>${this.xp}</b></p><div class="row"><button class="btn primary" id="againGame">Play again</button><button class="btn" id="backGames">Game Hub</button></div></div>`;
    bindButton("#againGame",()=>this.start(id));bindButton("#backGames",()=>this.exit());
    this.activeGame=null;
  },
  exit(){this.activeGame=null;App.navigate("games");},
  reset(){this.activeGame=null;this.questionIndex=0;this.score=0;this.xp=0;this.lives=3;this.combo=0;this.answered=false;}
};
function renderGames(){
  $("#view-games").innerHTML=`<div><h1>Game Hub</h1><p>Games turn engineering concepts into short practice loops. Scores and XP are local to this browser.</p></div>
  <div class="grid g3 section">${Object.entries(games).map(([id,g])=>`<div class="card clickable"><div class="iconbox">${g.icon}</div><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p><span class="tag">${g.questions.length} questions</span><span class="tag">${state.finishedGames.includes(id)?"✓ Completed":"Ready"}</span><div class="section"><button class="btn primary" data-game="${id}">${state.finishedGames.includes(id)?"Replay":"Start game"}</button></div></div>`).join("")}</div>`;

function renderProjects(){

function openProject(i){
  const p=projects[i];if(!p)return;
  const tasks=["Define requirements and acceptance criteria","Design architecture and data model","Implement the core workflow","Add unit/integration tests","Add error handling and security controls","Prepare deployment and monitoring","Explain the design in an interview"];
  const key="project-"+i,done=state.completedProjects.includes(key);
  openModal(`<div class="row between"><div><span class="tag">${esc(p[1])}</span><h2>${esc(p[0])}</h2></div><button class="btn" data-close>Close</button></div><p>${esc(p[2])}</p>
  <div class="notice"><b>Stack:</b> Choose a stack appropriate to the requirements. <b>Architecture:</b> start simple, identify boundaries, then scale only where evidence requires it.</div>
  <h3 class="section">Implementation plan</h3><div class="list">${tasks.map((t,n)=>`<button class="btn" data-task="${n}">□ ${esc(t)}</button>`).join("")}</div><div class="row section"><button class="btn primary" data-finish-project>Mark project progress complete</button></div>`);
  let selected=0;
  $("#modalBox").addEventListener("click",e=>{
    if(e.target.closest("[data-close]"))closeModal();
    const t=e.target.closest("[data-task]");if(t){t.textContent="✓ "+tasks[Number(t.dataset.task)];t.classList.add("good");selected++;}
    if(e.target.closest("[data-finish-project]")){
      if(!state.completedProjects.includes(key)){state.completedProjects.push(key);saveState();addXP(100,"project milestone");}
      else toast("Project already marked complete.");
      closeModal();renderProjects();renderAchievements();
    }
  });
}

function renderSettings(){
  $("#view-settings").innerHTML=`<div><h1>Settings</h1><p>Manage your local learning profile and saved browser data.</p></div>
  <div class="grid g2 section"><div class="card"><h3>Profile</h3><label for="displayName">Display name</label><input id="displayName" value="${esc(state.name)}" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);margin-top:7px"><button class="btn primary section" id="saveName">Save name</button></div>
  <div class="card"><h3>Appearance</h3><p>Switch between professional dark and light themes.</p><button class="btn" id="themeToggle">${state.theme==="dark"?"Use light theme":"Use dark theme"}</button></div>
  <div class="card"><h3>Progress backup</h3><p>Export your local state to a JSON file or import a previous backup.</p><div class="row"><button class="btn" id="exportState">Export progress</button><label class="btn" for="importState">Import progress<input id="importState" type="file" accept=".json,application/json" hidden></label></div></div>
  <div class="card"><h3>Reset</h3><p>Reset all CodeForge progress stored in this browser.</p><button class="btn danger" id="resetState">Reset progress</button></div></div>`;
  $("#saveName").addEventListener("click",()=>{state.name=$("#displayName").value.trim()||"Learner";saveState();toast("Name saved.");renderSettings();renderDashboard();});
  $("#themeToggle").addEventListener("click",()=>{state.theme=state.theme==="dark"?"light":"dark";saveState();applyTheme();renderSettings();});
  $("#exportState").addEventListener("click",exportState);
  $("#importState").addEventListener("change",importState);
  $("#resetState").addEventListener("click",()=>{if(confirm("Reset all learning progress? This cannot be undone unless you have an exported backup.")){state={...DEFAULT_STATE};saveState();applyTheme();App.renderAll();App.navigate("dashboard");toast("Progress reset.");}});
}
function applyTheme(){document.body.classList.toggle("light",state.theme==="light");}
function exportState(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="codeforge-progress.json";a.click();URL.revokeObjectURL(url);toast("Progress exported.");
}
function importState(e){
  const file=e.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!imported||typeof imported!=="object")throw new Error("Invalid backup");state={...DEFAULT_STATE,...imported};saveState();applyTheme();App.renderAll();App.navigate("dashboard");toast("Progress imported.");}catch(err){console.error(err);toast("Invalid progress file.");}};
  reader.readAsText(file);
}
function performSearch(query){
  const q=query.trim().toLowerCase(),box=$("#searchResults");
  if(!q){box.classList.remove("open");return;}
  const results=[];
  allCourses.forEach(c=>{if((c[0]+" "+c[1]+" "+c[4].join(" ")).toLowerCase().includes(q))results.push({type:"Course",title:c[0],action:()=>openCourse(c[0])});});
  projects.forEach((p,i)=>{if((p[0]+" "+p[1]+" "+p[2]).toLowerCase().includes(q))results.push({type:"Project",title:p[0],action:()=>{App.navigate("projects");setTimeout(()=>openProject(i),0);}});});
  interviewQuestions.forEach((x,i)=>{if((x[0]+" "+x[1]+" "+x[2]).toLowerCase().includes(q))results.push({type:"Interview",title:x[1],action:()=>{App.navigate("interviews");}});});
  Object.entries(games).forEach(([id,g])=>{if((g.name+" "+g.desc).toLowerCase().includes(q))results.push({type:"Game",title:g.name,action:()=>GameEngine.start(id)});});
  roadmaps.forEach((r,i)=>{if((r[0]+" "+r[1].join(" ")).toLowerCase().includes(q))results.push({type:"Roadmap",title:r[0],action:()=>{App.navigate("roadmaps");setTimeout(()=>openRoadmap(i),0);}});});
  const limited=results.slice(0,12);
  box.innerHTML=limited.length?limited.map((r,i)=>`<button type="button" data-result="${i}"><span class="tag">${esc(r.type)}</span> ${esc(r.title)}</button>`).join(""):`<div class="muted small" style="padding:10px">No results found.</div>`;
  box.classList.add("open");
  box.querySelectorAll("[data-result]").forEach((b,i)=>b.addEventListener("click",()=>{box.classList.remove("open");$("#globalSearch").value="";limited[i].action();}));
}

/* =========================
   DIAGNOSTICS
   ========================= */
function runSelfTest(){
  const checks=[
    ["App",typeof App==="object"],
    ["Navigation",$("#mainNav")!==null&&$$("[data-nav]").length===App.navItems.length],
    ["Course data",allCourses.length>0&&typeof getLessons==="function"],
    ["Game data",Object.keys(games).length>=10],
    ["LocalStorage",(()=>{try{localStorage.setItem("__cf_test","1");localStorage.removeItem("__cf_test");return true}catch{return false}})()],
    ["Views",App.navItems.every(x=>$("#view-"+x[0]))],
    ["Game engine",["start","answer","next","finish","reset"].every(k=>typeof GameEngine[k]==="function")]
  ];
  const failed=checks.filter(x=>!x[1]);
  if(failed.length)console.error("CodeForge self-test failures:",failed.map(x=>x[0]));
  else console.info("CodeForge self-test: PASS — all core checks passed.");
}
window.addEventListener("error",e=>{console.error("Application error:",e.error||e.message);toast("An application error occurred. Check the browser console for details.");});
window.addEventListener("unhandledrejection",e=>{console.error("Unhandled promise rejection:",e.reason);toast("An unexpected operation error occurred.");});

document.addEventListener("DOMContentLoaded",()=>{App.init();});
</script>
